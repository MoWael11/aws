<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS WebSocket Chat</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat {
      width: 420px;
      height: 650px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
    }

    .header h2 {
      margin-bottom: 5px;
    }

    #status {
      font-size: 14px;
      opacity: .9;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #f3f4f6;
    }

    .message {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 10px;
      word-wrap: break-word;
    }

    .me {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .other {
      background: white;
      border: 1px solid #ddd;
    }

    .controls {
      display: flex;
      padding: 12px;
      gap: 10px;
      background: white;
    }

    input {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      color: white;
    }

    #connectBtn {
      background: #16a34a;
    }

    #sendBtn {
      background: #2563eb;
    }
  </style>
</head>

<body>

  <div class="chat">

    <div class="header">
      <h2>Abo7med Chat</h2>
      <div id="status">Disconnected</div>
    </div>

    <div id="messages" class="messages"></div>

    <div class="controls">
      <input id="messageInput" placeholder="Type a message...">
      <button id="sendBtn">Send</button>
    </div>

    <div class="controls">
      <button id="connectBtn">Connect</button>
    </div>

  </div>

  <script>

    let ENDPOINT = "";
    let socket = null;

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const status = document.getElementById("status");
    const connectBtn = document.getElementById("connectBtn");

    function addMessage(text, me = false) {

      const div = document.createElement("div");
      div.className = "message " + (me ? "me" : "other");
      div.textContent = text;

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function initApp() {
      try {
        const response = await fetch('./config.json');
        const config = await response.json();

        ENDPOINT = config.socketEndpoint;

        connect();
      } catch (error) {
        console.error("Errore nel caricamento della configurazione:", error);
        status.textContent = "Config Error";
      }
    }

    function connect() {
      if (!ENDPOINT) return;
      if (socket && socket.readyState === WebSocket.OPEN)
        return;

      socket = new WebSocket(ENDPOINT);

      socket.onopen = () => {

        status.textContent = "Connected";
        status.style.color = "#90EE90";

        connectBtn.textContent = "Disconnect";
        connectBtn.style.background = "#dc2626";
      };

      socket.onmessage = (event) => {

        addMessage(event.data, false);

      };

      socket.onclose = () => {

        status.textContent = "Disconnected";
        status.style.color = "white";

        connectBtn.textContent = "Connect";
        connectBtn.style.background = "#16a34a";
      };

      socket.onerror = (err) => {
        console.error(err);
      };
    }

    function disconnect() {

      if (socket)
        socket.close();
    }

    connectBtn.onclick = () => {

      if (socket && socket.readyState === WebSocket.OPEN)
        disconnect();
      else
        connect();
    };

    initApp();

    function send() {

      if (!socket || socket.readyState !== WebSocket.OPEN) {
        alert("Not connected, please connect first.");
        return;
      }

      const message = input.value.trim();

      if (!message)
        return;

      socket.send(JSON.stringify({
        action: "sendMessage",
        message: message
      }));

      addMessage(message, true);

      input.value = "";
    }

    document.getElementById("sendBtn").onclick = send;

    input.addEventListener("keypress", e => {
      if (e.key === "Enter")
        send();
    });

  </script>

</body>

</html>
