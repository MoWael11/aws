AWSTemplateFormatVersion: 2010-09-09
Description: Apps template

Parameters:
  InfraStackName:
    Description: Enter the name of the infra stack
    Type: String
    Default: infra

  S3BucketName:
    Description: Enter S3 bucket name
    Type: String
    Default: cloudformation5902
    
  DBInstanceName:
    Description: Enter db username
    Type: String
    Default: db-instance

  DBUsername:
    Description: Enter username for Postgresql database 
    Type: String
    MinLength: '1'
    MaxLength: '16'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    Default: 'postgres'

Resources:
  SGStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${S3BucketName}.s3.us-east-1.amazonaws.com/apps/sg.yml
      Parameters:
        ProjectName: !ImportValue 
          "Fn::Sub": ${InfraStackName}-ProjectName
        Env: !ImportValue 
          "Fn::Sub": ${InfraStackName}-Env
        VpcId: !ImportValue
          "Fn::Sub": ${InfraStackName}-VpcId
  
  RDSStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SGStack
    Properties:
      TemplateURL: !Sub https://${S3BucketName}.s3.us-east-1.amazonaws.com/apps/rds.yml
      Parameters:
        DBInstanceName: !Ref DBInstanceName
        DBUsername: !Ref DBUsername
        PrivateSubnetaId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PrivateSubnetaId
        PrivateSubnetbId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PrivateSubnetbId
        DBSecurityGroupId: !GetAtt SGStack.Outputs.DBSecurityGroupId

  ALBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://${S3BucketName}.s3.us-east-1.amazonaws.com/apps/alb.yml
      Parameters:
        ProjectName: !ImportValue
          "Fn::Sub": ${InfraStackName}-ProjectName
        Env: !ImportValue 
          "Fn::Sub": ${InfraStackName}-Env
        PublicSubnetaId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PublicSubnetaId
        PublicSubnetbId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PublicSubnetbId
        LoadBalancerSecurityGroupId: !GetAtt SGStack.Outputs.LoadBalancerSecurityGroupId
        VpcId: !ImportValue
          "Fn::Sub": ${InfraStackName}-VpcId
  
  ASGStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: 
      - RDSStack
      - ALBStack
    Properties:
      TemplateURL: !Sub https://${S3BucketName}.s3.us-east-1.amazonaws.com/apps/asg.yml
      Parameters:
        S3BucketName: !Ref S3BucketName
        ProjectName: !ImportValue
          "Fn::Sub": ${InfraStackName}-ProjectName
        Env: !ImportValue 
          "Fn::Sub": ${InfraStackName}-Env
        PrivateSubnetaId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PrivateSubnetaId
        PrivateSubnetbId: !ImportValue 
          "Fn::Sub": ${InfraStackName}-PrivateSubnetbId
        WebAppSecurityGroupId: !GetAtt SGStack.Outputs.WebAppSecurityGroupId
        TargetGroupARN: !GetAtt ALBStack.Outputs.TargetGroupARN