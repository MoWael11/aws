AWSTemplateFormatVersion: 2010-09-09
Description: RDS template for apps

Parameters:
  DBInstanceName:
    Description: Enter db username
    Type: String

  DBUsername:
    Description: Enter username for Postgresql database 
    Type: String
    MinLength: '1'
    MaxLength: '16'
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'
    Default: 'postgres'

  DBPassword:
    NoEcho: true
    Description: Enter password for Postgresql database 
    Type: String
    MinLength: '8'
    MaxLength: '41'
    AllowedPattern: '[a-zA-Z0-9]*'
    
  PrivateSubnetaId:
    Description: Enter private subnet a ID
    Type: AWS::EC2::Subnet::Id
  
  PrivateSubnetbId:
    Description: Enter private subnet b ID
    Type: AWS::EC2::Subnet::Id

  DBSecurityGroupId:
    Description: Enter database security group ID
    Type: AWS::EC2::SecurityGroup::Id

Resources:
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS instance
      SubnetIds:
        - !Ref PrivateSubnetaId
        - !Ref PrivateSubnetbId

  DBInstance:
    Type: 'AWS::RDS::DBInstance'
    Properties:
      DBInstanceIdentifier: !Ref DBInstanceName
      AllocatedStorage: '5'
      Engine: postgres
      DBInstanceClass: db.t3.micro
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub ${DBPassword}
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: 
        - !Ref DBSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub db-instance

Outputs:
  DBEndpoint:
    Description: Database connection url
    Value: !GetAtt DBInstance.Endpoint.Address 