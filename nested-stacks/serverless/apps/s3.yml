AWSTemplateFormatVersion: "2010-09-09"
Description: S3 Bucket template for apps

Parameters:
  ProjectName:
    Description: Enter project name
    Type: String

  Env:
    Description: Enter dev, prod, test
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
      - test

  S3BucketName:
    Description: Enter S3 bucket name
    Type: String

Resources:
  SQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-${Env}-queue"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-queue"

  SQSQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SQSQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3SendMessage
            Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action:
              - sqs:SendMessage
            Resource: !GetAtt SQSQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:aws:s3:::${S3BucketName}-${AWS::AccountId}-${AWS::Region}"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  S3Bucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - SQSQueuePolicy
    Properties:
      BucketName: !Sub "${S3BucketName}-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt SQSQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .json
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Env}-bucket"

Outputs:
  SQSQueueArn:
    Description: The ARN of the SQS queue
    Value: !GetAtt SQSQueue.Arn